<script>// Activitats originals. Selecció introductòria, no equival a tot el currículum.

["mat","Matemàtiques","∑","#dce7ff","Nombres, patrons i problemes",[

["Calcula: 18 − 3 × 4.",["6","60","12"],0,"Primer multipliquem: 3 × 4 = 12. Després, 18 − 12 = 6."],
["Una recepta necessita 3/4 de litre de llet. Si en fas la meitat, quanta llet necessites?",["3/8 de litre","3/2 de litre","1/4 de litre"],0,"La meitat de 3/4 és 3/4 × 1/2 = 3/8."],
["La temperatura passa de −3 °C a 5 °C. Quants graus ha pujat?",["2","8","−8"],1,"De −3 a 0 puja 3 graus i de 0 a 5 en puja 5 més: 8 graus."]]],
["Mesura i dades","L’àrea d’un rectangle és base × altura. La mitjana és la suma de les dades dividida pel nombre de dades.",[
["Un pati fa 8 m de llarg i 5 m d’ample. Quina àrea té?",["26 m²","40 m²","13 m²"],1,"8 × 5 = 40 m². No confonguis àrea i perímetre."],
["Quina és la mitjana de 4, 6 i 8?",["6","18","5"],0,"(4 + 6 + 8) / 3 = 6."],
["Una samarreta de 20 € té un descompte del 25 %. Quant pagaràs?",["5 €","15 €","18 €"],1,"El 25 % de 20 és 5 €. El preu final és 20 − 5 = 15 €."]]]]],
["cat","Llengua catalana i literatura","Aa","#e6ddfa","Llegir, expressar i descobrir",[
["Comprensió i comunicació","La idea principal resumeix el sentit d’un text. En una notícia, diferencia els fets verificables de les opinions.",[
["«La biblioteca obrirà els dissabtes per facilitar l’accés als estudiants.» Quina és la idea principal?",["La biblioteca amplia l’horari","Els estudiants no llegeixen","La biblioteca tanca"],0,"El fet central és l’ampliació de l’horari; facilitar l’accés n’és la finalitat."],
["Quina frase expressa una opinió?",["El llibre té 120 pàgines","La novel·la és meravellosa","L’autor va néixer el 1980"],1,"«Meravellosa» és una valoració personal."],
["En un correu formal a una professora, quina salutació és adequada?",["Ei, tia!","Benvolguda professora,","Què passa?"],1,"La salutació s’adapta al destinatari i al grau de formalitat."]]],
["Reflexió lingüística i literatura","El nom designa éssers o conceptes; l’adjectiu en descriu qualitats. Un narrador en primera persona participa en el relat.",[
["Quin és l’adjectiu a «La casa antiga és al turó»?",["casa","antiga","turó"],1,"«Antiga» expressa una qualitat de la casa."],
["Quina paraula està accentuada correctament?",["camió","càmio","camio"],0,"«Camió» és aguda i acaba en vocal; porta accent."],
["«Vaig obrir la porta i em vaig espantar.» En quina persona narra?",["Primera","Segona","Tercera"],0,"«Vaig» i «em» indiquen una veu en primera persona."]]]]],
["cas","Lengua castellana y literatura","Ñ","#ffe2cf","Comprender y contar historias",[
["Textos y comunicación","Un texto narrativo cuenta sucesos. Un texto instructivo explica cómo hacer algo. La información explícita aparece directamente en el texto.",[
["¿Qué texto explica los pasos para preparar una receta?",["Narrativo","Instructivo","Poético"],1,"Las instrucciones presentan pasos ordenados para realizar una tarea."],
["«Marta perdió el autobús porque salió tarde.» ¿Por qué perdió el autobús?",["Porque salió tarde","Porque llovía","Porque estaba averiado"],0,"La causa aparece expresamente después de «porque»."],
["¿Qué fuente permite comprobar mejor el horario de un museo?",["Un comentario sin fecha","Su página oficial actualizada","Un rumor"],1,"Una fuente oficial y actualizada permite verificar ese dato."]]],
["Lengua y literatura","El sujeto concuerda con el verbo. Las palabras agudas llevan tilde si terminan en vocal, n o s. Una metáfora relaciona realidades sin usar «como».",[
["¿Cuál es el sujeto de «Los pájaros cantan al amanecer»?",["Los pájaros","cantan","al amanecer"],0,"«Los pájaros» concuerda en plural con «cantan»."],
["¿Qué palabra está bien escrita?",["cancion","canción","cáncion"],1,"«Canción» es aguda terminada en n."],
["«Tus ojos son dos estrellas» es…",["Una metáfora","Una instrucción","Una noticia"],0,"Identifica los ojos con estrellas para sugerir su brillo."]]]]],
["eng","Anglès","Hi!","#d6eee8","Everyday English, step by step",[
["Everyday communication","Use the present simple for habits. With he, she and it, most affirmative verbs add -s. Use do/does for questions.",[
["Choose: She ___ football every Saturday.",["play","plays","playing"],1,"With «she», the present simple affirmative is «plays»."],
["Choose the question.",["Does he like music?","Do he likes music?","Does he likes music?"],0,"After «does», use the base form «like»."],
["«The library is next to the school.» Where is the library?",["Beside the school","Inside the school","Far from the school"],0,"«Next to» means «beside»."]]],
["Descriptions and routines","Use there is for singular and there are for plural. The present continuous (am/is/are + -ing) describes an action happening now.",[
["Choose: There ___ three books on the table.",["is","are","am"],1,"«Three books» is plural: «there are»."],
["Choose: Look! They ___ in the park.",["run","are running","runs"],1,"«Look!» points to an action happening now."],
["Which reply fits «How often do you read?»",["Twice a week","In the library","A comic"],0,"«How often» asks about frequency."]]]]],
["bio","Biologia i geologia","⌘","#dceccc","La vida i el nostre planeta",[
["Éssers vius i ecosistemes","La cèl·lula és la unitat bàsica dels éssers vius. Els productors fabriquen matèria orgànica; les relacions alimentàries connecten els organismes.",[
["Quina estructura és present en tots els éssers vius?",["Cèl·lules","Pulmons","Arrels"],0,"Tots els éssers vius estan formats per una o més cèl·lules."],
["En una cadena alimentària, una alzina és…",["Productora","Consumidora primària","Consumidora secundària"],0,"Fa la fotosíntesi i fabrica matèria orgànica."],
["Si desapareixen els insectes pol·linitzadors, què pot passar?",["Algunes plantes es reproduiran menys","Totes les plantes creixeran més","No hi haurà cap efecte"],0,"Moltes plantes depenen dels pol·linitzadors per reproduir-se."]]],
["La Terra i la investigació","Les roques estan formades per minerals. En una investigació, una hipòtesi és una explicació provisional que es pot posar a prova.",[
["Què és una hipòtesi científica?",["Una explicació que es pot comprovar","Una veritat que no canvia","Qualsevol opinió"],0,"Ha de poder contrastar-se amb observacions o experiments."],
["Una roca formada pel refredament del magma és…",["Ígnia","Sedimentària","Sempre calcària"],0,"Les roques ígnies s’originen quan el magma o la lava se solidifiquen."],
["Per estudiar l’efecte de la llum en una planta, què convé mantenir igual?",["El reg i el tipus de planta","Només el color del test","Res"],0,"Cal controlar altres variables per aïllar l’efecte de la llum."]]]]],
["soc","Geografia i història","◎","#f7e4bb","Entendre el món i el passat",[
["Mapes i paisatges","La latitud mesura la distància angular a l’equador. Una escala relaciona una distància al mapa amb la distància real. El clima descriu patrons de molts anys.",[
["Quina línia separa els hemisferis nord i sud?",["L’equador","Greenwich","El tròpic de Càncer"],0,"L’equador correspon a la latitud 0°."],
["En un mapa 1:100.000, 1 cm representa…",["1 km","100 km","100 m"],0,"100.000 cm són 1.000 m: 1 km."],
["Quina frase parla del clima?",["Avui plou","Demà farà vent","Els estius són habitualment secs"],2,"El clima descriu comportaments habituals durant períodes llargs."]]],
["Investigar el passat","Les fonts primàries provenen de l’època estudiada. La sedentarització i l’agricultura són transformacions del neolític.",[
["Quina és una font primària per estudiar Roma?",["Una moneda romana","Un documental actual","Un manual escolar"],0,"La moneda és un objecte de l’època estudiada."],
["Quin canvi caracteritza el neolític?",["L’agricultura i la ramaderia","La màquina de vapor","La impremta"],0,"La producció d’aliments va afavorir l’establiment de poblats."],
["Quin ordre és cronològicament correcte?",["Egipte antic → Roma antiga → edat mitjana","Roma → edat mitjana → Egipte antic","Edat mitjana → Egipte antic → Roma"],0,"Les primeres civilitzacions egípcies precedeixen Roma i l’edat mitjana."]]]]],
["tec","Tecnologia i digitalització","⌁","#d6eaf3","Idear, construir i programar",[

["Quin és el primer pas per dissenyar un suport de mòbil?",["Definir què ha de resoldre","Pintar-lo","Comprar el més car"],0,"Entendre la necessitat ajuda a fixar criteris i restriccions."],
["Per què es recobreix un cable de coure amb plàstic?",["Perquè el plàstic és aïllant elèctric","Perquè condueixi més","Perquè pesi més"],0,"El coure condueix; el recobriment aïllant evita el contacte directe."],

["Pensament computacional","Un algoritme és una seqüència d’instruccions. Un bucle repeteix accions. Protegeix els comptes amb contrasenyes llargues i verificació en dos passos.",[
["Què fa un bucle «repeteix 4 vegades: avança 2 passos»?",["Avança 8 passos","Avança 6 passos","Avança 2 passos"],0,"L’acció de 2 passos es repeteix 4 vegades: 8."],
["Quin missatge és sospitós?",["Un correu que exigeix la contrasenya amb urgència","Un avís del calendari propi","Un document que has creat"],0,"L’urgència i la petició de credencials són indicis de pesca de credencials."],
["Per reutilitzar una imatge en un treball, cal…",["Comprovar-ne la llicència i citar-ne l’autoria","Assumir que totes són lliures","Esborrar la signatura"],0,"La disponibilitat a internet no implica permís de reutilització."]]]]],
["mus","Música","♫","#f7dce8","Escoltar, crear i interpretar",[

["Quantes negres completen un compàs de 4/4?",["Tres","Quatre","Sis"],1,"El 4 superior indica quatre pulsacions de negra."]]],

 const plan=state.plans[day],done=state.progress[day]?.completed||{};
 const blocks=plan?plan.blocks.map(b=>({id:b.id,name:b.name,count:b.activities.filter(q=>done[completionKey(q)]).length,total:b.activities.length})) : DAILY_BLOCKS.map(b=>({id:b.id,name:b.name,count:0,total:3}));
 const total=blocks.reduce((n,b)=>n+b.count,0);
 const goal=blocks.every(b=>b.count>=2),star=blocks.every(b=>b.count===3);
 return {day,blocks,total,goal,star,status:goal?'green':total?'yellow':'empty'};
}
function markCompleted(state,day,q,at){
 const plan=state.plans[day];
 if(!plan||!plan.blocks.some(b=>b.activities.some(a=>completionKey(a)===completionKey(q))))return false;
 const progress=state.progress[day]||(state.progress[day]={completed:{},goalAt:null,starAt:null});
 const key=completionKey(q);if(progress.completed[key])return false;

 if(summary.star&&!progress.starAt)progress.starAt=at;

}

</script><script>function about(){main.innerHTML=`<div class="eyebrow">UNA BASE OBERTA A CRÉIXER</div><h1 class="page-title">El mapa d’aprenentatge</h1><div class="prose"><p>Brúixola és un espai de repàs en català orientat a <strong>1r d’ESO</strong>. El banc conté <strong>${all.length.toLocaleString('ca')} activitats, 39 temes i 13 espais</strong>, amb 100 activitats per tema, amb explicacions per a cada resposta.</p><h2>Referència curricular</h2><p>La selecció parteix dels sabers i l’enfocament competencial publicats a <a href="https://xtec.gencat.cat/ca/curriculum/eso/curriculum-175-2022/" target="_blank" rel="noopener">XTEC · Currículum d’ESO, Decret 175/2022</a>. Base curricular consultada el 16 de novembre de 2026. Banc ampliat el 24 de novembre de 2026.</p><p>El currículum agrupa nombrosos sabers per a 1r i 2n o per a 1r, 2n i 3r. Per això aquesta és una <strong>selecció introductòria proposada</strong>, no un temari oficial exhaustiu ni una distribució obligatòria per a 1r.</p><p>Música, educació plàstica, tecnologia, física i química i educació en valors poden tenir una distribució diferent segons el curs i el centre. El francès s’ofereix com a exemple de segona llengua optativa. Les optatives pròpies del centre, altres llengües, l’aranès a l’Aran i religió, si es cursa, s’adaptaran quan disposem del programa concret.</p><h2>Més enllà de respondre preguntes</h2><p>Els qüestionaris permeten una primera pràctica de comprensió i raonament. No substitueixen l’expressió oral i escrita, les lectures, els experiments, la creació artística, la interpretació musical ni l’activitat física.</p><h2>Cent activitats per tema</h2><p>Cada matèria té tres temes. El tema 3 continua aquesta proposta general i no pretén reproduir la numeració del llibre de l’institut. El banc combina càlculs amb dades diferents, anàlisi gramatical i aplicacions de conceptes. Hi ha variants de pràctica sobre una mateixa habilitat, identificades al registre; cent activitats no vol dir cent conceptes independents.</p><p>Les sessions lliures tenen fins a deu preguntes i prioritzen les menys practicades. El repàs mixt agafa tres de cada tema. Els plans diaris ja desats es conserven; els nous inclouen els tres temes. L’ampliació manté les activitats originals i tot el registre local.</p><h2>Quan tinguem els teus temaris</h2><p>Podrem ajustar els blocs, afegir exercicis oberts i problemes, graduar la dificultat i preparar el repàs d’exàmens segons el que treballeu a classe.</p><h2>Què es guarda?</h2><p>Cada resposta registra la pregunta, la resposta triada, la solució, el resultat, el bloc, la data i el temps de resposta. Es desa al navegador d’aquest dispositiu. Si n’esborres les dades, es perdrà el registre; a «Per als adults» el pots exportar en JSON, i a «El meu progrés» en CSV. No s’envien respostes a un servidor.</p></div>`}

function progress(){
 const logs=answerLogs(),autonomous=logs.filter(a=>a.correct&&a.autonomous&&a.firstAttempt),assisted=logs.filter(a=>a.correct&&a.priorHelp),miss=all.filter(q=>latest(q.id)&&!latest(q.id).correct);
 main.innerHTML='<div id="save-status">'+warning()+'</div>'+ `<div class="eyebrow">EL TEU QUADERN DE VIATGE</div><h1 class="page-title">El meu progrés</h1><div class="kpi"><div><strong>${logs.length}</strong>respostes registrades</div><div><strong>${autonomous.length}</strong>encerts al primer intent sense ajuda</div><div><strong>${assisted.length}</strong>encerts amb ajuda</div></div><div class="actions"><button class="primary" id="review" ${miss.length?'':'disabled'}>Repassa els errors pendents (${miss.length})</button><button class="secondary" id="go-calendar">Calendari</button><button class="secondary" id="go-adults">Per als adults · exportació</button><button class="secondary" id="csv">Exporta respostes CSV</button></div><div class="table-wrap"><table><thead><tr><th>Matèria</th><th>Respostes</th><th>Primer intent autònom</th><th>Encerts amb ajuda</th></tr></thead><tbody>${subjects.map(s=>{const a=logs.filter(a=>a.subject===s.id);return `<tr><td>${s.name}</td><td>${a.length}</td><td>${a.filter(x=>x.correct&&x.autonomous&&x.firstAttempt).length}</td><td>${a.filter(x=>x.correct&&x.priorHelp).length}</td></tr>`}).join('')}</tbody></table></div><p class="note">Aquests recomptes no són una qualificació ni indiquen domini. Cal comparar dies, varietat i autonomia. Els encerts antics sense dades d’ajuda no es compten com a autònoms. El registre es desa només en aquest navegador: exporta’l periòdicament.</p><h2>Últimes respostes</h2>${logs.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Pregunta</th><th>Resposta</th><th>Resultat</th></tr></thead><tbody>${logs.slice(-30).reverse().map(a=>`<tr><td>${esc(new Date(a.date).toLocaleString('ca'))}</td><td>${esc(a.question)}</td><td>${esc(a.answer)}</td><td>${a.correct?(a.autonomous?'✓ Sense ajuda':a.priorHelp?'✓ Amb ajuda':'✓ Ajuda desconeguda'):'↻ Error'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Encara no hi ha respostes registrades.</p>'}`;
 document.querySelector('#review').onclick=()=>start(miss,'Reforcem les idees pendents');document.querySelector('#go-calendar').onclick=()=>render('calendar');document.querySelector('#go-adults').onclick=()=>render('adults');document.querySelector('#csv').onclick=exportCSV;
}
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(JSON.stringify(learningExport(state,recovery),null,2),'bruixola-aprenentatge-'+localDay()+'.json','application/json')}
function exportCSV(){const keys=['date','day','subject','topic','skill','question','answer','expected','correct','attemptNumber','sessionId','autonomous','priorHelp','seconds'],cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('\uFEFF'+[keys,...answerLogs().map(a=>keys.map(k=>a[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),'bruixola-respostes.csv','text/csv;charset=utf-8')}
function adults(){
 main.innerHTML='<div id="save-status">'+warning()+'</div>'+ `<div class="eyebrow">ACOMPANYAR L’APRENENTATGE</div><h1 class="page-title">Per als adults</h1><div class="prose"><p>Descarrega el registre periòdicament i adjunta el JSON a ChatGPT per analitzar errors recurrents, encerts al primer intent, dependència de pistes i evolució entre dies, i proposar exercicis de reforç.</p><div class="actions"><button class="primary" id="export">Descarregar registre d’aprenentatge (JSON)</button></div><h2>Què es desa?</h2><p>Cada resposta conserva activitat i versió, data local i hora, matèria, tema, habilitat, enunciat, opcions originals i ordre mostrat, resposta triada i correcta, número d’intent, sessió, pistes i comentaris. Les pistes també es registren si no s’arriba a respondre. El JSON inclou els plans exactes i una còpia del progrés.</p><p>El calendari compta activitats úniques comprovades, independentment de l’encert. Groc: alguna activitat. Verd: mínim dues en cadascun dels tres blocs. Estrella: les nou. Repetir no dona punts ni premis addicionals.</p><p>Un encert sense ajuda significa que no s’han consultat pistes ni rebut la solució abans en aquesta activitat durant el mateix dia. En les variants d’un mateix concepte també es té en compte l’ajuda rebuda en aquell concepte el mateix dia. Les exposicions de dies anteriors també consten, però permetem observar un nou encert autònom després d’un interval. Llegir teoria abans de començar no es pot determinar retrospectivament. Un sol encert no demostra consolidació.</p><h2>Dades locals, sense compte</h2><p><strong>Les dades només existeixen en aquest navegador i dispositiu.</strong> No hi ha servidor ni sincronització. Esborrar les dades del navegador o utilitzar navegació privada pot fer perdre el registre. Exporta’l periòdicament. Si el desament falla, s’avisa i encara pots exportar el que queda en memòria.</p><p>Conservem les respostes antigues només amb els camps coneguts. No reconstruïm opcions, pistes ni progrés diari que no es van registrar. Els camps desconeguts no es consideren encerts autònoms.</p><h2>Pràctica fora de pantalla</h2><p>La web actual conté qüestionaris, sense activitats manipulatives. Pots declarar una activitat externa: quedarà com a <strong>autodeclarada</strong>, sense considerar-la un encert avaluat ni sumar-la a les nou del calendari.</p><label for="offline-subject">Matèria</label><select id="offline-subject">${subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><label for="offline-text">Activitat feta (sense dades personals)</label><textarea id="offline-text" maxlength="2000" placeholder="Per exemple: lectura en veu alta durant deu minuts"></textarea><button class="secondary" id="offline-save">Desar com a autodeclarada</button><p id="offline-status" role="status"></p><h2>Controls independents</h2><p>Reiniciar el progrés buida només les marques del calendari. Esborrar el registre elimina respostes i pistes, però conserva el calendari. Després no es reconstrueixen intents a partir de les marques.</p><div class="actions"><button class="secondary" id="reset-progress">Reiniciar el progrés</button><button class="secondary danger" id="erase-logs">Esborrar el registre detallat</button></div></div>`;
 document.querySelector('#export').onclick=exportJSON;
 document.querySelector('#reset-progress').onclick=()=>{if(confirm('Vols reiniciar només el progrés del calendari? Es conservaran plans, respostes i pistes. Exporta una còpia abans si la vols conservar.')){state.progress={};state.lastProgressReset=new Date().toISOString();persist();adults()}};
 document.querySelector('#erase-logs').onclick=()=>{if(confirm('Vols esborrar tots els intents i pistes? No es podran recuperar sense una exportació prèvia. Es conservarà el calendari.')){state.logs=[];state.lastLogErasure=new Date().toISOString();if(persist()){try{localStorage.removeItem('bruixola-eso-v1')}catch(e){storageOK=false}}adults()}};
 document.querySelector('#offline-save').onclick=()=>{const text=document.querySelector('#offline-text').value.trim();if(!text){document.querySelector('#offline-status').textContent='Descriu primer l’activitat.';return}
 state.logs.push({eventId:newId(),activityId:'self-'+newId(),contentVersion:CONTENT_VERSION,type:'self-report',attemptNumber:1,date:new Date().toISOString(),day:localDay(),subject:document.querySelector('#offline-subject').value,topic:'Pràctica fora de pantalla',skill:'Autodeclarada, sense avaluació',exercise:{type:'self-reported',statement:text,data:null,options:null},response:{declaredCompleted:true},sessionId:newId(),hintsConsulted:[],selfReported:true,assessed:false,correct:null,expected:null});persist();document.querySelector('#offline-text').value='';document.querySelector('#offline-status').textContent=storageOK?'Activitat autodeclarada desada.':'Registrada en memòria; exporta-la abans de sortir.'};
}
function checkDay(){if(visibleDay===localDay())return;visibleDay=localDay();ensurePlan();if(session?.daily){changedDailyDay();return}if(!modal.open&&(currentView==='home'||currentView==='calendar'))render(currentView)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));document.querySelector('.brand').onclick=e=>{e.preventDefault();render()};document.querySelector('#close').onclick=()=>modal.close();
modal.addEventListener('close',()=>{session=null;if(['home','calendar','progress'].includes(currentView))render(currentView)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});window.addEventListener('focus',checkDay);setInterval(checkDay,30000);
window.addEventListener('storage',e=>{if(e.key!==STORE_KEY)return;if(session){externalChange=true;storageOK=false;refreshWarnings();return}const fresh=loadLearning(browserStorage,false);state=fresh.state;storageOK=fresh.ok;recovery=fresh.recovery;render(currentView==='subject'?'home':currentView)});
render();
</script></body></html>
