<script>// Activitats originals. Selecció introductòria, no equival a tot el currículum.

["mat","Matemàtiques","∑","#dce7ff","Nombres, patrons i problemes",[

["Calcula: 18 − 3 × 4.",["6","60","12"],0,"Primer multipliquem: 3 × 4 = 12. Després, 18 − 12 = 6."],
["Una recepta necessita 3/4 de litre de llet. Si en fas la meitat, quanta llet necessites?",["3/8 de litre","3/2 de litre","1/4 de litre"],0,"La meitat de 3/4 és 3/4 × 1/2 = 3/8."],
["La temperatura passa de −3 °C a 5 °C. Quants graus ha pujat?",["2","8","−8"],1,"De −3 a 0 puja 3 graus i de 0 a 5 en puja 5 més: 8 graus."]]],
["Mesura i dades","L’àrea d’un rectangle és base × altura. La mitjana és la suma de les dades dividida pel nombre de dades.",[
["Un pati fa 8 m de llarg i 5 m d’ample. Quina àrea té?",["26 m²","40 m²","13 m²"],1,"8 × 5 = 40 m². No confonguis àrea i perímetre."],
["Quina és la mitjana de 4, 6 i 8?",["6","18","5"],0,"(4 + 6 + 8) / 3 = 6."],
["Una samarreta de 20 € té un descompte del 25 %. Quant pagaràs?",["5 €","15 €","18 €"],1,"El 25 % de 20 és 5 €. El preu final és 20 − 5 = 15 €."]]]]],
["cat","Llengua catalana i literatura","Aa","#e6ddfa","Llegir, expressar i descobrir",[
["Comprensió i comunicació","La idea principal resumeix el sentit d’un text. En una notícia, diferencia els fets verificables de les opinions.",[
["«La biblioteca obrirà els dissabtes per facilitar l’accés als estudiants.» Quina és la idea principal?",["La biblioteca amplia l’horari","Els estudiants no llegeixen","La biblioteca tanca"],0,"El fet central és l’ampliació de l’horari; facilitar l’accés n’és la finalitat."],
["Quina frase expressa una opinió?",["El llibre té 120 pàgines","La novel·la és meravellosa","L’autor va néixer el 1980"],1,"«Meravellosa» és una valoració personal."],
["En un correu formal a una professora, quina salutació és adequada?",["Ei, tia!","Benvolguda professora,","Què passa?"],1,"La salutació s’adapta al destinatari i al grau de formalitat."]]],
["Reflexió lingüística i literatura","El nom designa éssers o conceptes; l’adjectiu en descriu qualitats. Un narrador en primera persona participa en el relat.",[
["Quin és l’adjectiu a «La casa antiga és al turó»?",["casa","antiga","turó"],1,"«Antiga» expressa una qualitat de la casa."],
["Quina paraula està accentuada correctament?",["camió","càmio","camio"],0,"«Camió» és aguda i acaba en vocal; porta accent."],
["«Vaig obrir la porta i em vaig espantar.» En quina persona narra?",["Primera","Segona","Tercera"],0,"«Vaig» i «em» indiquen una veu en primera persona."]]]]],
["cas","Lengua castellana y literatura","Ñ","#ffe2cf","Comprender y contar historias",[
["Textos y comunicación","Un texto narrativo cuenta sucesos. Un texto instructivo explica cómo hacer algo. La información explícita aparece directamente en el texto.",[
["¿Qué texto explica los pasos para preparar una receta?",["Narrativo","Instructivo","Poético"],1,"Las instrucciones presentan pasos ordenados para realizar una tarea."],
["«Marta perdió el autobús porque salió tarde.» ¿Por qué perdió el autobús?",["Porque salió tarde","Porque llovía","Porque estaba averiado"],0,"La causa aparece expresamente después de «porque»."],
["¿Qué fuente permite comprobar mejor el horario de un museo?",["Un comentario sin fecha","Su página oficial actualizada","Un rumor"],1,"Una fuente oficial y actualizada permite verificar ese dato."]]],
["Lengua y literatura","El sujeto concuerda con el verbo. Las palabras agudas llevan tilde si terminan en vocal, n o s. Una metáfora relaciona realidades sin usar «como».",[
["¿Cuál es el sujeto de «Los pájaros cantan al amanecer»?",["Los pájaros","cantan","al amanecer"],0,"«Los pájaros» concuerda en plural con «cantan»."],
["¿Qué palabra está bien escrita?",["cancion","canción","cáncion"],1,"«Canción» es aguda terminada en n."],
["«Tus ojos son dos estrellas» es…",["Una metáfora","Una instrucción","Una noticia"],0,"Identifica los ojos con estrellas para sugerir su brillo."]]]]],
["eng","Anglès","Hi!","#d6eee8","Everyday English, step by step",[
["Everyday communication","Use the present simple for habits. With he, she and it, most affirmative verbs add -s. Use do/does for questions.",[
["Choose: She ___ football every Saturday.",["play","plays","playing"],1,"With «she», the present simple affirmative is «plays»."],
["Choose the question.",["Does he like music?","Do he likes music?","Does he likes music?"],0,"After «does», use the base form «like»."],
["«The library is next to the school.» Where is the library?",["Beside the school","Inside the school","Far from the school"],0,"«Next to» means «beside»."]]],
["Descriptions and routines","Use there is for singular and there are for plural. The present continuous (am/is/are + -ing) describes an action happening now.",[
["Choose: There ___ three books on the table.",["is","are","am"],1,"«Three books» is plural: «there are»."],
["Choose: Look! They ___ in the park.",["run","are running","runs"],1,"«Look!» points to an action happening now."],
["Which reply fits «How often do you read?»",["Twice a week","In the library","A comic"],0,"«How often» asks about frequency."]]]]],
["bio","Biologia i geologia","⌘","#dceccc","La vida i el nostre planeta",[
["Éssers vius i ecosistemes","La cèl·lula és la unitat bàsica dels éssers vius. Els productors fabriquen matèria orgànica; les relacions alimentàries connecten els organismes.",[
["Quina estructura és present en tots els éssers vius?",["Cèl·lules","Pulmons","Arrels"],0,"Tots els éssers vius estan formats per una o més cèl·lules."],
["En una cadena alimentària, una alzina és…",["Productora","Consumidora primària","Consumidora secundària"],0,"Fa la fotosíntesi i fabrica matèria orgànica."],
["Si desapareixen els insectes pol·linitzadors, què pot passar?",["Algunes plantes es reproduiran menys","Totes les plantes creixeran més","No hi haurà cap efecte"],0,"Moltes plantes depenen dels pol·linitzadors per reproduir-se."]]],
["La Terra i la investigació","Les roques estan formades per minerals. En una investigació, una hipòtesi és una explicació provisional que es pot posar a prova.",[
["Què és una hipòtesi científica?",["Una explicació que es pot comprovar","Una veritat que no canvia","Qualsevol opinió"],0,"Ha de poder contrastar-se amb observacions o experiments."],
["Una roca formada pel refredament del magma és…",["Ígnia","Sedimentària","Sempre calcària"],0,"Les roques ígnies s’originen quan el magma o la lava se solidifiquen."],
["Per estudiar l’efecte de la llum en una planta, què convé mantenir igual?",["El reg i el tipus de planta","Només el color del test","Res"],0,"Cal controlar altres variables per aïllar l’efecte de la llum."]]]]],
["soc","Geografia i història","◎","#f7e4bb","Entendre el món i el passat",[
["Mapes i paisatges","La latitud mesura la distància angular a l’equador. Una escala relaciona una distància al mapa amb la distància real. El clima descriu patrons de molts anys.",[
["Quina línia separa els hemisferis nord i sud?",["L’equador","Greenwich","El tròpic de Càncer"],0,"L’equador correspon a la latitud 0°."],
["En un mapa 1:100.000, 1 cm representa…",["1 km","100 km","100 m"],0,"100.000 cm són 1.000 m: 1 km."],
["Quina frase parla del clima?",["Avui plou","Demà farà vent","Els estius són habitualment secs"],2,"El clima descriu comportaments habituals durant períodes llargs."]]],
["Investigar el passat","Les fonts primàries provenen de l’època estudiada. La sedentarització i l’agricultura són transformacions del neolític.",[
["Quina és una font primària per estudiar Roma?",["Una moneda romana","Un documental actual","Un manual escolar"],0,"La moneda és un objecte de l’època estudiada."],
["Quin canvi caracteritza el neolític?",["L’agricultura i la ramaderia","La màquina de vapor","La impremta"],0,"La producció d’aliments va afavorir l’establiment de poblats."],
["Quin ordre és cronològicament correcte?",["Egipte antic → Roma antiga → edat mitjana","Roma → edat mitjana → Egipte antic","Edat mitjana → Egipte antic → Roma"],0,"Les primeres civilitzacions egípcies precedeixen Roma i l’edat mitjana."]]]]],
["tec","Tecnologia i digitalització","⌁","#d6eaf3","Idear, construir i programar",[

["Quin és el primer pas per dissenyar un suport de mòbil?",["Definir què ha de resoldre","Pintar-lo","Comprar el més car"],0,"Entendre la necessitat ajuda a fixar criteris i restriccions."],
["Per què es recobreix un cable de coure amb plàstic?",["Perquè el plàstic és aïllant elèctric","Perquè condueixi més","Perquè pesi més"],0,"El coure condueix; el recobriment aïllant evita el contacte directe."],

["Pensament computacional","Un algoritme és una seqüència d’instruccions. Un bucle repeteix accions. Protegeix els comptes amb contrasenyes llargues i verificació en dos passos.",[
["Què fa un bucle «repeteix 4 vegades: avança 2 passos»?",["Avança 8 passos","Avança 6 passos","Avança 2 passos"],0,"L’acció de 2 passos es repeteix 4 vegades: 8."],
["Quin missatge és sospitós?",["Un correu que exigeix la contrasenya amb urgència","Un avís del calendari propi","Un document que has creat"],0,"L’urgència i la petició de credencials són indicis de pesca de credencials."],
["Per reutilitzar una imatge en un treball, cal…",["Comprovar-ne la llicència i citar-ne l’autoria","Assumir que totes són lliures","Esborrar la signatura"],0,"La disponibilitat a internet no implica permís de reutilització."]]]]],
["mus","Música","♫","#f7dce8","Escoltar, crear i interpretar",[

["Quantes negres completen un compàs de 4/4?",["Tres","Quatre","Sis"],1,"El 4 superior indica quatre pulsacions de negra."]]],

</script><script>/* Browser-local learning records. No network or reconstructed historical answers. */
const CONTENT_VERSION='2026-11-16.2', STORE_KEY='bruixola-learning-v2';
const DAILY_BLOCKS=[
 {id:'languages',name:'Llengües',subjects:['cat','cas','eng','fra']},
 {id:'science',name:'Ciència i tecnologia',subjects:['mat','bio','fq','tec']},
 {id:'world',name:'Món, expressió i benestar',subjects:['soc','mus','art','ef','val']}
];
function localDay(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function newId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function emptyState(){return {schemaVersion:2,logs:[],progress:{},plans:{},createdAt:new Date().toISOString()}}
function loadLearning(storage,writeBack=true){
 let state=emptyState(),ok=true,recovery=null;
 try{
  const raw=storage.getItem(STORE_KEY);
  if(raw!==null){
   const parsed=JSON.parse(raw);
   if(parsed.schemaVersion!==2||!Array.isArray(parsed.logs)||!parsed.progress||!parsed.plans)throw Error('Format de dades desconegut');
   state=parsed;
  }else{
   const oldRaw=storage.getItem('bruixola-eso-v1');
   const old=oldRaw?JSON.parse(oldRaw):[];
   if(!Array.isArray(old))throw Error('Registre anterior il·legible');
   state.logs=old.map(a=>({...a,activityId:a.qid,contentVersion:null,skill:null,sessionId:null,attemptNumber:null,hintsConsulted:null,autonomous:null,priorHelp:null,exercise:null,dataQuality:'legacy-partial',legacyNote:'Només dades guardades a la versió anterior; no es reconstrueixen opcions, pistes ni intents.'}));
   state.migration={at:new Date().toISOString(),legacyCount:old.length};
  }
  if(writeBack)storage.setItem(STORE_KEY,JSON.stringify(state));
 }catch(e){
  ok=false;
  // Never overwrite unreadable data. Include the exact raw text in a recovery export.
  try{recovery={v2:storage.getItem(STORE_KEY),legacy:storage.getItem('bruixola-eso-v1')}}catch(ignore){}
 }
 return {state,ok,recovery};
}
function seededOrder(items,seed){
 let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);
 const next=()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296};
 const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(next()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result;
}
function buildPlan(day,questions){
 return {day,contentVersion:CONTENT_VERSION,blocks:DAILY_BLOCKS.map(b=>({...b,activities:seededOrder(questions.filter(q=>b.subjects.includes(q.subject)),day+'|'+b.id+'|'+CONTENT_VERSION).slice(0,3).map(q=>({...q,options:[...q.options],contentVersion:CONTENT_VERSION}))}))};
}
function completionKey(q){return q.id+'@'+(q.contentVersion||CONTENT_VERSION)}
function dailySummary(state,day){
 const plan=state.plans[day],done=state.progress[day]?.completed||{};
 const blocks=plan?plan.blocks.map(b=>({id:b.id,name:b.name,count:b.activities.filter(q=>done[completionKey(q)]).length,total:b.activities.length})) : DAILY_BLOCKS.map(b=>({id:b.id,name:b.name,count:0,total:3}));
 const total=blocks.reduce((n,b)=>n+b.count,0);
 const goal=blocks.every(b=>b.count>=2),star=blocks.every(b=>b.count===3);
 return {day,blocks,total,goal,star,status:goal?'green':total?'yellow':'empty'};
}
function markCompleted(state,day,q,at){
 const plan=state.plans[day];
 if(!plan||!plan.blocks.some(b=>b.activities.some(a=>completionKey(a)===completionKey(q))))return false;
 const progress=state.progress[day]||(state.progress[day]={completed:{},goalAt:null,starAt:null});
 const key=completionKey(q);if(progress.completed[key])return false;
 progress.completed[key]={at,activityId:q.id,contentVersion:q.contentVersion||CONTENT_VERSION};
 const summary=dailySummary(state,day);
 if(summary.goal&&!progress.goalAt)progress.goalAt=at;
 if(summary.star&&!progress.starAt)progress.starAt=at;
 return true;
}
function learningExport(state,recovery=null){
 return {app:'Brúixola · 1r ESO',schemaVersion:2,contentVersion:CONTENT_VERSION,exportedAt:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,definitions:{dailyGoal:'Tres blocs, tres activitats úniques per bloc. Groc: alguna completada. Verd: mínim dues a cadascun. Estrella: nou.',completed:'Pregunta comprovada almenys una vegada, independentment de l’encert; repetir no suma.',autonomous:'Encert sense pistes ni comentaris previs en aquesta activitat el mateix dia; les exposicions de dies anteriors es registren separadament.',selfReported:'Activitat declarada per l’usuari; correct=null i assessed=false.',legacy:'Es conserven només les dades conegudes. Els camps desconeguts són null; no s’infereixen respostes ni progrés diari antic.'},logs:state.logs,progress:state.progress,dailyPlans:state.plans,dailySummaries:Object.keys(state.plans).sort().map(day=>dailySummary(state,day)),migration:state.migration||null,lastProgressReset:state.lastProgressReset||null,lastLogErasure:state.lastLogErasure||null,recovery};
}
</script><script>function about(){main.innerHTML=`<div class="eyebrow">UNA BASE OBERTA A CRÉIXER</div><h1 class="page-title">El mapa d’aprenentatge</h1><div class="prose"><p>Brúixola és un espai de repàs en català orientat a <strong>1r d’ESO</strong>. Aquesta primera versió conté <strong>78 preguntes originals, 26 temes i 13 espais</strong>, amb explicacions per a cada resposta.</p><h2>Referència curricular</h2><p>La selecció parteix dels sabers i l’enfocament competencial publicats a <a href="https://xtec.gencat.cat/ca/curriculum/eso/curriculum-175-2022/" target="_blank" rel="noopener">XTEC · Currículum d’ESO, Decret 175/2022</a>. Consulta de la font: 16 de novembre de 2026.</p><p>El currículum agrupa nombrosos sabers per a 1r i 2n o per a 1r, 2n i 3r. Per això aquesta és una <strong>selecció introductòria proposada</strong>, no un temari oficial exhaustiu ni una distribució obligatòria per a 1r.</p><p>Música, educació plàstica, tecnologia, física i química i educació en valors poden tenir una distribució diferent segons el curs i el centre. El francès s’ofereix com a exemple de segona llengua optativa. Les optatives pròpies del centre, altres llengües, l’aranès a l’Aran i religió, si es cursa, s’adaptaran quan disposem del programa concret.</p><h2>Més enllà de respondre preguntes</h2><p>Els qüestionaris permeten una primera pràctica de comprensió i raonament. No substitueixen l’expressió oral i escrita, les lectures, els experiments, la creació artística, la interpretació musical ni l’activitat física.</p><h2>Quan tinguem els teus temaris</h2><p>Podrem ajustar els blocs, afegir exercicis oberts i problemes, graduar la dificultat i preparar el repàs d’exàmens segons el que treballeu a classe.</p><h2>Què es guarda?</h2><p>Cada resposta registra la pregunta, la resposta triada, la solució, el resultat, el bloc, la data i el temps de resposta. Es desa al navegador d’aquest dispositiu. Si n’esborres les dades, es perdrà el registre; a «Per als adults» el pots exportar en JSON, i a «El meu progrés» en CSV. No s’envien respostes a un servidor.</p></div>`}
</script><script>const main=document.querySelector('main'),modal=document.querySelector('dialog');

 box.innerHTML=`<div class="cal-head"><button id="prev-month" aria-label="Mes anterior">‹</button><h2>${esc(first.toLocaleDateString('ca',{month:'long',year:'numeric'}))}</h2><button id="next-month" aria-label="Mes següent">›</button></div><div class="cal-week">${['dl','dt','dc','dj','dv','ds','dg'].map(d=>'<span>'+d+'</span>').join('')}</div><div class="cal-grid">${cells.join('')}</div><p class="cal-legend"><span>🟡 Iniciat</span><span>🟢 ≥2 per bloc</span><span>★ 9/9</span></p><button class="secondary" id="today-detail">Avui · ${dailySummary(state,localDay()).total}/9 →</button>`;
 document.querySelector('#prev-month').onclick=()=>{calendarDate=new Date(year,month-1,1);drawCalendar()};document.querySelector('#next-month').onclick=()=>{calendarDate=new Date(year,month+1,1);drawCalendar()};
 document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(b.dataset.day));document.querySelector('#today-detail').onclick=()=>openDay(localDay());
}
function openDay(day){
 if(day===localDay())ensurePlan(day);
 const summary=dailySummary(state,day),plan=state.plans[day],done=state.progress[day]?.completed||{};
 document.querySelector('#activity-body').innerHTML=`<div class="eyebrow">CALENDARI · DATA LOCAL</div><h2 id="activity-title" class="question">${esc(new Date(day+'T12:00:00').toLocaleDateString('ca',{day:'numeric',month:'long',year:'numeric'}))}</h2><p>${summary.total}/9 activitats · ${summary.star?'★ Nou activitats completades':summary.goal?'Objectiu diari assolit':'Objectiu: almenys dues activitats de cada bloc'}</p><p class="subtle">Una activitat compta quan has comprovat una resposta, encara que sigui incorrecta. Repetir no suma. El calendari mesura pràctica, no domini.</p>${plan?plan.blocks.map(b=>`<section class="day-block"><h3>${b.name} · ${summary.blocks.find(x=>x.id===b.id).count}/3</h3><ul>${b.activities.map(q=>`<li>${done[completionKey(q)]?'✓':'○'} ${esc(q.subjectName)} · ${esc(q.topic)}<br><small>${esc(q.text)}</small></li>`).join('')}</ul>${day===localDay()?`<button class="primary" data-block="${b.id}">Practica aquest bloc →</button>`:''}</section>`).join(''):'<p>No hi ha un pla ni pràctica desada per aquest dia. No reconstruïm les activitats anteriors que no es van registrar.</p>'}<div id="modal-save-status">${warning()}</div>`;
 if(!modal.open)modal.showModal();
 document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{const block=plan.blocks.find(x=>x.id===b.dataset.block),pending=block.activities.filter(q=>!done[completionKey(q)]);start(pending.length?pending:block.activities,block.name,{daily:true,blockId:block.id})});
}
function start(qs,title,options={}){
 if(!qs.length)return;ensurePlan();session={id:newId(),qs:shuffle(qs),title,index:0,day:localDay(),daily:!!options.daily,blockId:options.blockId||null};
 if(!modal.open)modal.showModal();question();
}
function changedDailyDay(){
 if(!session?.daily||session.day===localDay())return false;
 session=null;ensurePlan();document.querySelector('#activity-body').innerHTML='<h2 id="activity-title">Ha començat un dia nou</h2><p>El calendari utilitza la data local. La pràctica d’ahir queda amb la seva data. Repren el repte d’avui.</p><button class="primary" id="new-day">Obre el repte d’avui</button>';document.querySelector('#new-day').onclick=()=>openDay(localDay());return true;
}
function question(){if(changedDailyDay())return;session.presentation={id:newId(),started:Date.now(),attempt:0,hints:[],feedbackSeen:false,locked:false,options:shuffle(session.qs[session.index].options.map((text,i)=>({text,index:i})))};showQuestion()}
function showQuestion(){
 const s=session,q=s.qs[s.index],p=s.presentation;
 document.querySelector('#activity-body').innerHTML=`<div class="eyebrow">${esc(s.title)}</div><p class="subtle">${esc(q.subjectName)} · ${esc(q.topic)}</p><div class="bar"><i style="width:${s.index/s.qs.length*100}%"></i></div><p class="subtle">Activitat ${s.index+1} de ${s.qs.length} · intent ${p.attempt+1}</p><h2 id="activity-title" class="question">${esc(q.text)}</h2><div class="options">${p.options.map(o=>`<button class="option" data-answer="${o.index}">${esc(o.text)}</button>`).join('')}</div><div class="actions"><button class="secondary" id="hint">Consulta una pista</button></div><div id="hint-content" aria-live="polite">${p.hints.length?'<p class="feedback">'+esc(q.lesson)+'</p>':''}</div><div id="feedback" aria-live="polite"></div><div id="modal-save-status">${warning()}</div>`;
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));document.querySelector('#hint').onclick=hint;document.querySelector('.option')?.focus();
}
function snapshot(){
 const s=session,q=s.qs[s.index],p=s.presentation;
 return {eventId:newId(),activityId:q.id,qid:q.id,contentVersion:q.contentVersion||CONTENT_VERSION,type:'answer',date:new Date().toISOString(),day:localDay(),localTimestamp:new Date().toString(),timezoneOffsetMinutes:new Date().getTimezoneOffset(),subject:q.subject,subjectName:q.subjectName,topic:q.topic,skill:q.skill||q.topic,sessionId:s.id,presentationId:p.id,dailyBlockId:s.blockId,plannedDay:s.daily?s.day:null,exercise:{type:'multiple-choice',statement:q.text,options:[...q.options],displayedOptions:p.options.map(o=>({...o})),data:null,lesson:q.lesson,explanation:q.explanation},question:q.text,hintsConsulted:p.hints.map(h=>({...h})),hadFeedbackBefore:p.feedbackSeen,priorHelp:p.hints.length>0||p.feedbackSeen,priorExposureCount:answerLogs().filter(a=>(a.activityId||a.qid)===q.id).length,seconds:Math.round((Date.now()-p.started)/1000),assessed:true,selfReported:false};
}
function hint(){
 if(changedDailyDay())return;const p=session.presentation,q=session.qs[session.index];if(p.locked)return;
 const h={id:'lesson-'+q.id,text:q.lesson,date:new Date().toISOString()};p.hints.push(h);const event=snapshot();event.type='hint';event.hint=h;event.correct=null;event.assessed=false;state.logs.push(event);persist();document.querySelector('#hint-content').innerHTML='<p class="feedback">'+esc(q.lesson)+'</p>';
}
function answer(choice){
 if(changedDailyDay())return;const s=session,p=s.presentation;if(p.locked)return;const q=s.qs[s.index];if(!Number.isInteger(choice)||!q.options[choice])return;
 p.locked=true;p.attempt++;const correct=choice===q.answer,event=snapshot(),previous=answerLogs().filter(a=>(a.activityId||a.qid)===q.id),feedbackInSession=previous.some(a=>a.sessionId===s.id&&a.feedbackDelivered),previousHintsToday=state.logs.filter(a=>a.type==='hint'&&a.activityId===q.id&&a.day===event.day),sameDayHelp=previous.some(a=>a.day===event.day&&a.feedbackDelivered)||previousHintsToday.length>0;
 Object.assign(event,{answer:q.options[choice],answerIndex:choice,expected:q.options[q.answer],expectedIndex:q.answer,correct,attemptNumber:p.attempt,lifetimeAttempt:previous.length+1,hadFeedbackBefore:p.feedbackSeen||previous.some(a=>a.feedbackDelivered),feedbackAfterErrorBefore:previous.some(a=>!a.correct&&a.feedbackDelivered),previousHintsToday:previousHintsToday.map(a=>a.hint),priorHelp:event.priorHelp||feedbackInSession||sameDayHelp,autonomous:correct&&!event.priorHelp&&!feedbackInSession&&!sameDayHelp,firstAttempt:p.attempt===1,firstAttemptToday:!previous.some(a=>a.day===event.day),feedbackDelivered:true,feedbackText:q.explanation});
 state.logs.push(event);ensurePlan(event.day);markCompleted(state,event.day,q,event.date);persist();
 document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===q.answer)b.classList.add('correct');else if(+b.dataset.answer===choice)b.classList.add('wrong')});document.querySelector('#hint').disabled=true;
 document.querySelector('#feedback').innerHTML=`<div class="feedback ${correct?'':'error'}"><strong>${correct?(event.autonomous?'Encert sense ajuda en aquesta pràctica':'Encert amb ajuda en aquesta pràctica'):'Seguim aprenent.'}</strong><br>${esc(q.explanation)}</div><div class="actions">${!correct?'<button class="secondary" id="retry">Torna-ho a provar amb ajuda</button>':''}<button class="primary" id="next">${s.index+1<s.qs.length?'Següent activitat →':'Veure el resultat'}</button></div>`;
 p.feedbackSeen=true;if(!correct)document.querySelector('#retry').onclick=()=>{if(changedDailyDay())return;p.locked=false;showQuestion()};
 document.querySelector('#next').onclick=()=>{if(changedDailyDay())return;s.index++;if(s.index<s.qs.length)question();else result()};document.querySelector('#next').focus();
}
function result(){
 const s=session,records=answerLogs().filter(a=>a.sessionId===s.id),correct=new Set(records.filter(a=>a.correct).map(a=>a.activityId)).size,autonomous=new Set(records.filter(a=>a.autonomous&&a.firstAttempt).map(a=>a.activityId)).size;
 document.querySelector('#activity-body').innerHTML=`<div class="eyebrow">PRÀCTICA COMPLETADA</div><h2 id="activity-title" class="question">Cada pas compta.</h2><div class="result-score">${correct} / ${s.qs.length}</div><p>${autonomous} encerts al primer intent sense ajuda en aquesta sessió.</p><p class="subtle">Els errors i les pistes també es registren. Un encert no vol dir que un contingut estigui consolidat.</p><div id="modal-save-status">${warning()}</div><div class="actions"><button class="primary" id="finish">Continua explorant</button><button class="secondary" id="see-progress">Veure el progrés</button></div>`;
 document.querySelector('#finish').onclick=()=>{modal.close();render()};document.querySelector('#see-progress').onclick=()=>{modal.close();render('progress')};
}
function progress(){
 const logs=answerLogs(),autonomous=logs.filter(a=>a.correct&&a.autonomous&&a.firstAttempt),assisted=logs.filter(a=>a.correct&&a.priorHelp),miss=all.filter(q=>latest(q.id)&&!latest(q.id).correct);
 main.innerHTML='<div id="save-status">'+warning()+'</div>'+ `<div class="eyebrow">EL TEU QUADERN DE VIATGE</div><h1 class="page-title">El meu progrés</h1><div class="kpi"><div><strong>${logs.length}</strong>respostes registrades</div><div><strong>${autonomous.length}</strong>encerts al primer intent sense ajuda</div><div><strong>${assisted.length}</strong>encerts amb ajuda</div></div><div class="actions"><button class="primary" id="review" ${miss.length?'':'disabled'}>Repassa els errors pendents (${miss.length})</button><button class="secondary" id="go-calendar">Calendari</button><button class="secondary" id="go-adults">Per als adults · exportació</button><button class="secondary" id="csv">Exporta respostes CSV</button></div><div class="table-wrap"><table><thead><tr><th>Matèria</th><th>Respostes</th><th>Primer intent autònom</th><th>Encerts amb ajuda</th></tr></thead><tbody>${subjects.map(s=>{const a=logs.filter(a=>a.subject===s.id);return `<tr><td>${s.name}</td><td>${a.length}</td><td>${a.filter(x=>x.correct&&x.autonomous&&x.firstAttempt).length}</td><td>${a.filter(x=>x.correct&&x.priorHelp).length}</td></tr>`}).join('')}</tbody></table></div><p class="note">Aquests recomptes no són una qualificació ni indiquen domini. Cal comparar dies, varietat i autonomia. Els encerts antics sense dades d’ajuda no es compten com a autònoms. El registre es desa només en aquest navegador: exporta’l periòdicament.</p><h2>Últimes respostes</h2>${logs.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Pregunta</th><th>Resposta</th><th>Resultat</th></tr></thead><tbody>${logs.slice(-30).reverse().map(a=>`<tr><td>${esc(new Date(a.date).toLocaleString('ca'))}</td><td>${esc(a.question)}</td><td>${esc(a.answer)}</td><td>${a.correct?(a.autonomous?'✓ Sense ajuda':a.priorHelp?'✓ Amb ajuda':'✓ Ajuda desconeguda'):'↻ Error'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Encara no hi ha respostes registrades.</p>'}`;
 document.querySelector('#review').onclick=()=>start(miss,'Reforcem les idees pendents');document.querySelector('#go-calendar').onclick=()=>render('calendar');document.querySelector('#go-adults').onclick=()=>render('adults');document.querySelector('#csv').onclick=exportCSV;
}
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(JSON.stringify(learningExport(state,recovery),null,2),'bruixola-aprenentatge-'+localDay()+'.json','application/json')}
function exportCSV(){const keys=['date','day','subject','topic','skill','question','answer','expected','correct','attemptNumber','sessionId','autonomous','priorHelp','seconds'],cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('\uFEFF'+[keys,...answerLogs().map(a=>keys.map(k=>a[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),'bruixola-respostes.csv','text/csv;charset=utf-8')}
function adults(){
 main.innerHTML='<div id="save-status">'+warning()+'</div>'+ `<div class="eyebrow">ACOMPANYAR L’APRENENTATGE</div><h1 class="page-title">Per als adults</h1><div class="prose"><p>Descarrega el registre periòdicament i adjunta el JSON a ChatGPT per analitzar errors recurrents, encerts al primer intent, dependència de pistes i evolució entre dies, i proposar exercicis de reforç.</p><div class="actions"><button class="primary" id="export">Descarregar registre d’aprenentatge (JSON)</button></div><h2>Què es desa?</h2><p>Cada resposta conserva activitat i versió, data local i hora, matèria, tema, habilitat, enunciat, opcions originals i ordre mostrat, resposta triada i correcta, número d’intent, sessió, pistes i comentaris. Les pistes també es registren si no s’arriba a respondre. El JSON inclou els plans exactes i una còpia del progrés.</p><p>El calendari compta activitats úniques comprovades, independentment de l’encert. Groc: alguna activitat. Verd: mínim dues en cadascun dels tres blocs. Estrella: les nou. Repetir no dona punts ni premis addicionals.</p><p>Un encert sense ajuda significa que no s’han consultat pistes ni rebut la solució abans en aquesta activitat durant el mateix dia. Les exposicions de dies anteriors també consten, però permetem observar un nou encert autònom després d’un interval. Llegir teoria abans de començar no es pot determinar retrospectivament. Un sol encert no demostra consolidació.</p><h2>Dades locals, sense compte</h2><p><strong>Les dades només existeixen en aquest navegador i dispositiu.</strong> No hi ha servidor ni sincronització. Esborrar les dades del navegador o utilitzar navegació privada pot fer perdre el registre. Exporta’l periòdicament. Si el desament falla, s’avisa i encara pots exportar el que queda en memòria.</p><p>Conservem les respostes antigues només amb els camps coneguts. No reconstruïm opcions, pistes ni progrés diari que no es van registrar. Els camps desconeguts no es consideren encerts autònoms.</p><h2>Pràctica fora de pantalla</h2><p>La web actual conté qüestionaris, sense activitats manipulatives. Pots declarar una activitat externa: quedarà com a <strong>autodeclarada</strong>, sense considerar-la un encert avaluat ni sumar-la a les nou del calendari.</p><label for="offline-subject">Matèria</label><select id="offline-subject">${subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><label for="offline-text">Activitat feta (sense dades personals)</label><textarea id="offline-text" maxlength="2000" placeholder="Per exemple: lectura en veu alta durant deu minuts"></textarea><button class="secondary" id="offline-save">Desar com a autodeclarada</button><p id="offline-status" role="status"></p><h2>Controls independents</h2><p>Reiniciar el progrés buida només les marques del calendari. Esborrar el registre elimina respostes i pistes, però conserva el calendari. Després no es reconstrueixen intents a partir de les marques.</p><div class="actions"><button class="secondary" id="reset-progress">Reiniciar el progrés</button><button class="secondary danger" id="erase-logs">Esborrar el registre detallat</button></div></div>`;
 document.querySelector('#export').onclick=exportJSON;
 document.querySelector('#reset-progress').onclick=()=>{if(confirm('Vols reiniciar només el progrés del calendari? Es conservaran plans, respostes i pistes. Exporta una còpia abans si la vols conservar.')){state.progress={};state.lastProgressReset=new Date().toISOString();persist();adults()}};
 document.querySelector('#erase-logs').onclick=()=>{if(confirm('Vols esborrar tots els intents i pistes? No es podran recuperar sense una exportació prèvia. Es conservarà el calendari.')){state.logs=[];state.lastLogErasure=new Date().toISOString();if(persist()){try{localStorage.removeItem('bruixola-eso-v1')}catch(e){storageOK=false}}adults()}};
 document.querySelector('#offline-save').onclick=()=>{const text=document.querySelector('#offline-text').value.trim();if(!text){document.querySelector('#offline-status').textContent='Descriu primer l’activitat.';return}
 state.logs.push({eventId:newId(),activityId:'self-'+newId(),contentVersion:CONTENT_VERSION,type:'self-report',sessionId:newId(),attemptNumber:1,date:new Date().toISOString(),day:localDay(),subject:document.querySelector('#offline-subject').value,topic:'Pràctica fora de pantalla',skill:'Autodeclarada, sense avaluació',exercise:{type:'self-reported',statement:text,data:null,options:null},response:{declaredCompleted:true},sessionId:newId(),hintsConsulted:[],selfReported:true,assessed:false,correct:null,expected:null});persist();document.querySelector('#offline-text').value='';document.querySelector('#offline-status').textContent=storageOK?'Activitat autodeclarada desada.':'Registrada en memòria; exporta-la abans de sortir.'};
}
function checkDay(){if(visibleDay===localDay())return;visibleDay=localDay();ensurePlan();if(session?.daily){changedDailyDay();return}if(!modal.open&&(currentView==='home'||currentView==='calendar'))render(currentView)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));document.querySelector('.brand').onclick=e=>{e.preventDefault();render()};document.querySelector('#close').onclick=()=>modal.close();
modal.addEventListener('close',()=>{session=null;if(['home','calendar','progress'].includes(currentView))render(currentView)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});window.addEventListener('focus',checkDay);setInterval(checkDay,30000);
window.addEventListener('storage',e=>{if(e.key!==STORE_KEY)return;if(session){externalChange=true;storageOK=false;refreshWarnings();return}const fresh=loadLearning(browserStorage,false);state=fresh.state;storageOK=fresh.ok;recovery=fresh.recovery;render(currentView==='subject'?'home':currentView)});
render();
</script></body></html>
