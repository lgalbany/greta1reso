<script>// Activitats originals. Selecció introductòria, no equival a tot el currículum.
const subjects = [
["mat","Matemàtiques","∑","#dce7ff","Nombres, patrons i problemes",[
["Nombres i operacions","Respecta la jerarquia: parèntesis, potències, multiplicacions i divisions, sumes i restes. Una fracció representa parts iguals d’una unitat.",[
["Calcula: 18 − 3 × 4.",["6","60","12"],0,"Primer multipliquem: 3 × 4 = 12. Després, 18 − 12 = 6."],
["Una recepta necessita 3/4 de litre de llet. Si en fas la meitat, quanta llet necessites?",["3/8 de litre","3/2 de litre","1/4 de litre"],0,"La meitat de 3/4 és 3/4 × 1/2 = 3/8."],
["La temperatura passa de −3 °C a 5 °C. Quants graus ha pujat?",["2","8","−8"],1,"De −3 a 0 puja 3 graus i de 0 a 5 en puja 5 més: 8 graus."]]],
["Mesura i dades","L’àrea d’un rectangle és base × altura. La mitjana és la suma de les dades dividida pel nombre de dades.",[
["Un pati fa 8 m de llarg i 5 m d’ample. Quina àrea té?",["26 m²","40 m²","13 m²"],1,"8 × 5 = 40 m². No confonguis àrea i perímetre."],
["Quina és la mitjana de 4, 6 i 8?",["6","18","5"],0,"(4 + 6 + 8) / 3 = 6."],
["Una samarreta de 20 € té un descompte del 25 %. Quant pagaràs?",["5 €","15 €","18 €"],1,"El 25 % de 20 és 5 €. El preu final és 20 − 5 = 15 €."]]]]],
["cat","Llengua catalana i literatura","Aa","#e6ddfa","Llegir, expressar i descobrir",[
["Comprensió i comunicació","La idea principal resumeix el sentit d’un text. En una notícia, diferencia els fets verificables de les opinions.",[
["«La biblioteca obrirà els dissabtes per facilitar l’accés als estudiants.» Quina és la idea principal?",["La biblioteca amplia l’horari","Els estudiants no llegeixen","La biblioteca tanca"],0,"El fet central és l’ampliació de l’horari; facilitar l’accés n’és la finalitat."],
["Quina frase expressa una opinió?",["El llibre té 120 pàgines","La novel·la és meravellosa","L’autor va néixer el 1980"],1,"«Meravellosa» és una valoració personal."],
["En un correu formal a una professora, quina salutació és adequada?",["Ei, tia!","Benvolguda professora,","Què passa?"],1,"La salutació s’adapta al destinatari i al grau de formalitat."]]],
["Reflexió lingüística i literatura","El nom designa éssers o conceptes; l’adjectiu en descriu qualitats. Un narrador en primera persona participa en el relat.",[
["Quin és l’adjectiu a «La casa antiga és al turó»?",["casa","antiga","turó"],1,"«Antiga» expressa una qualitat de la casa."],
["Quina paraula està accentuada correctament?",["camió","càmio","camio"],0,"«Camió» és aguda i acaba en vocal; porta accent."],
["«Vaig obrir la porta i em vaig espantar.» En quina persona narra?",["Primera","Segona","Tercera"],0,"«Vaig» i «em» indiquen una veu en primera persona."]]]]],
["cas","Lengua castellana y literatura","Ñ","#ffe2cf","Comprender y contar historias",[
["Textos y comunicación","Un texto narrativo cuenta sucesos. Un texto instructivo explica cómo hacer algo. La información explícita aparece directamente en el texto.",[
["¿Qué texto explica los pasos para preparar una receta?",["Narrativo","Instructivo","Poético"],1,"Las instrucciones presentan pasos ordenados para realizar una tarea."],
["«Marta perdió el autobús porque salió tarde.» ¿Por qué perdió el autobús?",["Porque salió tarde","Porque llovía","Porque estaba averiado"],0,"La causa aparece expresamente después de «porque»."],
["¿Qué fuente permite comprobar mejor el horario de un museo?",["Un comentario sin fecha","Su página oficial actualizada","Un rumor"],1,"Una fuente oficial y actualizada permite verificar ese dato."]]],
["Lengua y literatura","El sujeto concuerda con el verbo. Las palabras agudas llevan tilde si terminan en vocal, n o s. Una metáfora relaciona realidades sin usar «como».",[
["¿Cuál es el sujeto de «Los pájaros cantan al amanecer»?",["Los pájaros","cantan","al amanecer"],0,"«Los pájaros» concuerda en plural con «cantan»."],
["¿Qué palabra está bien escrita?",["cancion","canción","cáncion"],1,"«Canción» es aguda terminada en n."],
["«Tus ojos son dos estrellas» es…",["Una metáfora","Una instrucción","Una noticia"],0,"Identifica los ojos con estrellas para sugerir su brillo."]]]]],
["eng","Anglès","Hi!","#d6eee8","Everyday English, step by step",[
["Everyday communication","Use the present simple for habits. With he, she and it, most affirmative verbs add -s. Use do/does for questions.",[
["Choose: She ___ football every Saturday.",["play","plays","playing"],1,"With «she», the present simple affirmative is «plays»."],
["Choose the question.",["Does he like music?","Do he likes music?","Does he likes music?"],0,"After «does», use the base form «like»."],
["«The library is next to the school.» Where is the library?",["Beside the school","Inside the school","Far from the school"],0,"«Next to» means «beside»."]]],
["Descriptions and routines","Use there is for singular and there are for plural. The present continuous (am/is/are + -ing) describes an action happening now.",[
["Choose: There ___ three books on the table.",["is","are","am"],1,"«Three books» is plural: «there are»."],
["Choose: Look! They ___ in the park.",["run","are running","runs"],1,"«Look!» points to an action happening now."],
["Which reply fits «How often do you read?»",["Twice a week","In the library","A comic"],0,"«How often» asks about frequency."]]]]],
["bio","Biologia i geologia","⌘","#dceccc","La vida i el nostre planeta",[
["Éssers vius i ecosistemes","La cèl·lula és la unitat bàsica dels éssers vius. Els productors fabriquen matèria orgànica; les relacions alimentàries connecten els organismes.",[
["Quina estructura és present en tots els éssers vius?",["Cèl·lules","Pulmons","Arrels"],0,"Tots els éssers vius estan formats per una o més cèl·lules."],
["En una cadena alimentària, una alzina és…",["Productora","Consumidora primària","Consumidora secundària"],0,"Fa la fotosíntesi i fabrica matèria orgànica."],
["Si desapareixen els insectes pol·linitzadors, què pot passar?",["Algunes plantes es reproduiran menys","Totes les plantes creixeran més","No hi haurà cap efecte"],0,"Moltes plantes depenen dels pol·linitzadors per reproduir-se."]]],
["La Terra i la investigació","Les roques estan formades per minerals. En una investigació, una hipòtesi és una explicació provisional que es pot posar a prova.",[
["Què és una hipòtesi científica?",["Una explicació que es pot comprovar","Una veritat que no canvia","Qualsevol opinió"],0,"Ha de poder contrastar-se amb observacions o experiments."],
["Una roca formada pel refredament del magma és…",["Ígnia","Sedimentària","Sempre calcària"],0,"Les roques ígnies s’originen quan el magma o la lava se solidifiquen."],
["Per estudiar l’efecte de la llum en una planta, què convé mantenir igual?",["El reg i el tipus de planta","Només el color del test","Res"],0,"Cal controlar altres variables per aïllar l’efecte de la llum."]]]]],
["soc","Geografia i història","◎","#f7e4bb","Entendre el món i el passat",[
["Mapes i paisatges","La latitud mesura la distància angular a l’equador. Una escala relaciona una distància al mapa amb la distància real. El clima descriu patrons de molts anys.",[
["Quina línia separa els hemisferis nord i sud?",["L’equador","Greenwich","El tròpic de Càncer"],0,"L’equador correspon a la latitud 0°."],
["En un mapa 1:100.000, 1 cm representa…",["1 km","100 km","100 m"],0,"100.000 cm són 1.000 m: 1 km."],
["Quina frase parla del clima?",["Avui plou","Demà farà vent","Els estius són habitualment secs"],2,"El clima descriu comportaments habituals durant períodes llargs."]]],
["Investigar el passat","Les fonts primàries provenen de l’època estudiada. La sedentarització i l’agricultura són transformacions del neolític.",[
["Quina és una font primària per estudiar Roma?",["Una moneda romana","Un documental actual","Un manual escolar"],0,"La moneda és un objecte de l’època estudiada."],
["Quin canvi caracteritza el neolític?",["L’agricultura i la ramaderia","La màquina de vapor","La impremta"],0,"La producció d’aliments va afavorir l’establiment de poblats."],
["Quin ordre és cronològicament correcte?",["Egipte antic → Roma antiga → edat mitjana","Roma → edat mitjana → Egipte antic","Edat mitjana → Egipte antic → Roma"],0,"Les primeres civilitzacions egípcies precedeixen Roma i l’edat mitjana."]]]]],
["tec","Tecnologia i digitalització","⌁","#d6eaf3","Idear, construir i programar",[
["Projectes i materials","Un projecte tecnològic parteix d’una necessitat, explora solucions, dissenya, construeix i avalua. Els materials s’escullen segons les propietats.",[
["Quin és el primer pas per dissenyar un suport de mòbil?",["Definir què ha de resoldre","Pintar-lo","Comprar el més car"],0,"Entendre la necessitat ajuda a fixar criteris i restriccions."],
["Per què es recobreix un cable de coure amb plàstic?",["Perquè el plàstic és aïllant elèctric","Perquè condueixi més","Perquè pesi més"],0,"El coure condueix; el recobriment aïllant evita el contacte directe."],
["Un prototip es prova per…",["Detectar millores abans del producte final","Evitar qualsevol canvi","Substituir el disseny"],0,"L’avaluació permet revisar la solució."]]],
["Pensament computacional","Un algoritme és una seqüència d’instruccions. Un bucle repeteix accions. Protegeix els comptes amb contrasenyes llargues i verificació en dos passos.",[
["Què fa un bucle «repeteix 4 vegades: avança 2 passos»?",["Avança 8 passos","Avança 6 passos","Avança 2 passos"],0,"L’acció de 2 passos es repeteix 4 vegades: 8."],
["Quin missatge és sospitós?",["Un correu que exigeix la contrasenya amb urgència","Un avís del calendari propi","Un document que has creat"],0,"L’urgència i la petició de credencials són indicis de pesca de credencials."],
["Per reutilitzar una imatge en un treball, cal…",["Comprovar-ne la llicència i citar-ne l’autoria","Assumir que totes són lliures","Esborrar la signatura"],0,"La disponibilitat a internet no implica permís de reutilització."]]]]],
["mus","Música","♫","#f7dce8","Escoltar, crear i interpretar",[
["Llenguatge musical","El pols és la pulsació regular. El ritme combina durades; el tempo indica la velocitat. En un compàs de 4/4 hi caben quatre negres.",[
["Què indica el tempo?",["La velocitat de la música","El volum","El timbre"],0,"El tempo expressa la rapidesa del pols."],
["Quantes corxeres equivalen a una negra?",["Dues","Quatre","Una"],0,"Una corxera dura la meitat d’una negra."],
["Quantes negres completen un compàs de 4/4?",["Tres","Quatre","Sis"],1,"El 4 superior indica quatre pulsacions de negra."]]],
["Escolta i creació","El timbre permet distingir veus i instruments. La intensitat és el volum; l’altura diferencia sons greus i aguts.",[
["Quina qualitat distingeix una flauta d’un violí que fan la mateixa nota?",["Timbre","Durada","Tempo"],0,"Cada instrument té un timbre característic."],
["En música, «piano» com a indicació de dinàmica vol dir…",["Fluix","De pressa","Agut"],0,"És una indicació d’intensitat suau."],
["Quin instrument és de corda?",["Violoncel","Clarinet","Trompeta"],0,"El violoncel produeix el so per la vibració de cordes."]]]]],
["art","Educació plàstica, visual i audiovisual","◈","#f6dccb","Mirar amb uns altres ulls",[
["Elements visuals","La línia, el color, la forma i la textura construeixen imatges. Una composició distribueix els elements per comunicar una intenció.",[
["Què descriu la textura visual?",["L’aparença de la superfície","El pes real","El so"],0,"Pot suggerir rugositat o suavitat sense tocar la superfície."],
["En barreja de pigments tradicional, groc i blau produeixen…",["Verd","Vermell","Taronja"],0,"En el model tradicional de pintura, aquesta barreja dona verd."],
["Per destacar el títol d’un cartell, és útil…",["Crear contrast amb el fons","Fer-lo il·legible","Amagar-lo al marge"],0,"El contrast afavoreix la jerarquia i la llegibilitat."]]],
["Imatges i missatges","Les imatges comuniquen decisions de qui les crea. Un enquadrament selecciona què veiem i què queda fora.",[
["Un primer pla mostra sobretot…",["El rostre o un detall proper","Tot un paisatge llunyà","Sempre un edifici"],0,"Acosta l’atenció a una expressió o un detall."],
["Retallar una fotografia pot canviar-ne el sentit?",["Sí, perquè elimina context","No, mai","Només si és en blanc i negre"],0,"El que queda fora pot ser essencial per interpretar l’escena."],
["Abans de crear un cartell, cal pensar en…",["El públic i el missatge","Només la mida del fitxer","Només la marca del llapis"],0,"Les decisions visuals han de servir a una intenció comunicativa."]]]]],
["ef","Educació física","↗","#e5edcf","Moviment, equip i benestar",[
["Vida activa","Una sessió inclou activació, part principal i tornada a la calma. La intensitat s’adapta al nivell i augmenta progressivament.",[
["Per què fem un escalfament?",["Per preparar el cos progressivament","Per cansar-nos al màxim","Per evitar beure aigua"],0,"L’activació prepara per a l’esforç de la part principal."],
["Després d’una activitat intensa, què és adequat?",["Reduir l’esforç progressivament","Aturar-se sempre de cop","Fer un esprint màxim"],0,"La tornada a la calma facilita una recuperació gradual."],

["Cooperació i entorn","El joc net implica respecte i resolució dialogada dels conflictes. A la natura, cal preparar el recorregut i respectar l’entorn.",[
["Davant una decisió arbitral discutible, què afavoreix el joc net?",["Parlar amb respecte","Insultar","Abandonar els companys"],0,"El respecte permet gestionar el desacord sense agressions."],
["En una ruta, què cal fer amb els residus?",["Endur-se’ls","Amagar-los sota pedres","Deixar-los si són petits"],0,"Cal evitar deixar residus a l’entorn."],
["En una activitat cooperativa, l’objectiu és…",["Coordinar-se per assolir una fita compartida","Excloure qui té dificultats","Guanyar individualment sempre"],0,"La cooperació requereix participació i ajuda mútua."]]]]],
["val","Educació en valors cívics i ètics","☷","#e3e0f4","Conviure i pensar amb criteri",[
["Convivència i drets","Els drets humans corresponen a totes les persones. L’empatia ajuda a entendre altres perspectives sense haver de compartir-les.",[
["Un company rep burles repetides. Quina acció ajuda?",["Donar-li suport i avisar un adult de confiança","Compartir les burles","Ignorar-lo sempre"],0,"El suport i la intervenció adequada ajuden a aturar la situació."],
["Un dret humà correspon…",["A totes les persones","Només a qui pensa com jo","Només a les persones adultes"],0,"Els drets humans són universals."],
["Escoltar amb empatia vol dir…",["Intentar comprendre l’altra perspectiva","Estar sempre d’acord","Interrompre per donar consells"],0,"Comprendre no obliga a compartir una opinió."]]],
["Pensament crític","Un argument aporta raons. Davant una afirmació, pregunta quines proves la sustenten i si la font és fiable.",[
["Quina resposta aporta un argument?",["Proposo reparar-lo perquè genera menys residus","És així perquè sí","Tothom ho diu"],0,"Relaciona una proposta amb una raó que es pot discutir."],
["Abans de compartir una notícia sorprenent, convé…",["Verificar la font, la data i altres fonts","Compartir-la immediatament","Mirar només el titular"],0,"Contrastar ajuda a evitar la desinformació."],
["Una decisió democràtica també ha de…",["Respectar els drets de les minories","Eliminar tota discrepància","Donar tots els drets a la majoria"],0,"La democràcia combina participació amb garanties de drets."]]]]],
["fq","Física i química","⚗","#d8e9ec","Matèria, energia i experiments",[
["Matèria i mescles","La massa mesura quantitat de matèria i el volum, l’espai ocupat. Una mescla es pot separar amb mètodes físics segons les propietats dels components.",[
["Quin instrument mesura la massa?",["Balança","Termòmetre","Cronòmetre"],0,"La balança mesura massa; el termòmetre, temperatura."],
["Com separaries sorra i aigua?",["Filtració","Imantació","Congelant sempre"],0,"El filtre reté la sorra i deixa passar l’aigua."],
["La fusió és el pas de…",["Sòlid a líquid","Líquid a gas","Gas a sòlid"],0,"El gel que es fon és un exemple de fusió."]]],
["Mesura i energia","Utilitza unitats i registra observacions. L’energia es pot transferir i transformar. Temperatura i calor són conceptes diferents.",[
["Quants metres són 2,5 km?",["2.500 m","250 m","25 m"],0,"Un quilòmetre són 1.000 metres."],
["En una bombeta, l’energia elèctrica es transforma en…",["Llum i energia tèrmica","Només so","Matèria nova"],0,"La bombeta emet llum i també escalfa."],
["Per comparar resultats experimentals cal…",["Indicar magnituds, valors i unitats","Escriure només nombres","Triar el resultat que agrada més"],0,"Les unitats donen significat físic a les mesures."]]]]],
["fra","Segona llengua · Francès","Salut","#eee2d7","Optativa · primers passos",[
["Premiers échanges","Bonjour és una salutació formal o diürna. Je m’appelle introdueix el nom. J’ai indica «tinc».",[
["Com dius «Em dic Anna»?",["Je m’appelle Anna","J’ai Anna","Je suis appelle Anna"],0,"«Je m’appelle» serveix per presentar-se."],
["Què vol dir «Merci»?",["Gràcies","Adeu","Bon dia"],0,"És una fórmula d’agraïment."],
["Completa: J’___ douze ans.",["ai","suis","est"],0,"En francès l’edat s’expressa amb el verb avoir."]]],
["Le quotidien","Els noms tenen gènere. Un/une són articles indefinits; le/la/les són definits. El vocabulari quotidià ajuda a comprendre missatges senzills.",[
["Què vol dir «un livre»?",["Un llibre","Una finestra","Un llapis"],0,"«Livre» vol dir llibre."],
["Tria el plural de «le chat».",["les chats","la chats","le chates"],0,"L’article plural és «les» i el nom afegeix -s."],
["Què vol dir «À demain»?",["Fins demà","Bona nit","Si us plau"],0,"És un comiat fins al dia següent."]]]]]
].map(([id,name,icon,color,desc,topics])=>({id,name,icon,color,desc,topics:topics.map(([name,lesson,qs],t)=>({name,lesson,qs:qs.map(([text,options,answer,explanation],q)=>({id:id+'-'+t+'-'+q,text,options,answer,explanation}))}))}));
</script><script>const main=document.querySelector('main'), modal=document.querySelector('dialog');
const KEY='bruixola-eso-v1'; let attempts=[],storageOK=true,session=null,currentView='home';
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))attempts=raw.filter(a=>a&&typeof a.qid==='string'&&typeof a.correct==='boolean');localStorage.setItem(KEY,JSON.stringify(attempts));}catch(e){storageOK=false}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=subjects.flatMap(s=>s.topics.flatMap(t=>t.qs.map(q=>({...q,subject:s.id,subjectName:s.name,topic:t.name}))));
const latest=id=>attempts.filter(a=>a.qid===id).at(-1);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const count=s=>all.filter(q=>q.subject===s&&latest(q.id)?.correct).length;
function save(){try{localStorage.setItem(KEY,JSON.stringify(attempts))}catch(e){storageOK=false}}
function markNav(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function render(v='home'){currentView=v;markNav(v);if(v==='home')home();if(v==='progress')progress();if(v==='about')about();window.scrollTo(0,0)}
function warning(){return storageOK?'':'<p id="storage-warning" role="alert">El navegador no permet desar el progrés. Les respostes es conservaran només mentre aquesta pàgina continuï oberta. Exporta-les abans de sortir.</p>'}
function home(){main.innerHTML=warning()+`<section class="hero"><div><div class="eyebrow">EL TEU PUNT DE PARTIDA · 1r D’ESO</div><h1>Un món per aprendre.<br>Al teu ritme.</h1><p>Descobreix, practica i connecta idees. Tria una matèria o deixa que la brúixola et proposi un petit repte.</p><button class="primary" id="daily">Comença un repte mixt <span aria-hidden="true">↗</span></button></div><div class="art" aria-hidden="true"><div class="orbit"><div class="compass">✦</div></div><span class="float one">a² + b²</span><span class="float two">Hello, món!</span></div></section><div class="stats"><div class="stat"><strong>${subjects.length}</strong> espais per explorar</div><div class="stat"><strong>${all.length}</strong> preguntes inicials</div><div class="stat"><strong>${new Set(attempts.filter(a=>a.correct).map(a=>a.qid)).size}</strong> descobertes encertades</div></div><section><div class="section-head"><div><h2>Què vols descobrir avui?</h2><div class="subtle">Totes les matèries, un sol lloc per avançar.</div></div><div class="search"><input id="search" aria-label="Cercar matèria o tema" placeholder="Cerca una matèria o tema…"><select id="filter" aria-label="Filtrar matèries"><option value="all">Tots els espais</option><option value="review">Per reforçar</option><option value="new">Per descobrir</option></select></div></div><div class="grid" id="cards"></div><div class="note">✧ <strong>Una base que creixerà amb tu.</strong> Selecció introductòria orientada a 1r d’ESO. La distribució de matèries i sabers depèn del centre; adaptarem aquest espai als teus temaris.</div></section>`;
document.querySelector('#daily').onclick=()=>start(shuffle(all).slice(0,9),'Repte mixt · 9 preguntes');
document.querySelector('#search').oninput=cards;document.querySelector('#filter').onchange=cards;cards()}
function shuffle(xs){return [...xs].sort(()=>Math.random()-.5)}
function cards(){const query=document.querySelector('#search').value.toLocaleLowerCase('ca'),filter=document.querySelector('#filter').value;const list=subjects.filter(s=>(s.name+' '+s.desc+' '+s.topics.map(t=>t.name).join(' ')).toLocaleLowerCase('ca').includes(query)).filter(s=>filter==='all'||(filter==='review'?all.some(q=>q.subject===s.id&&latest(q.id)&&!latest(q.id).correct):count(s.id)<6));
document.querySelector('#cards').innerHTML=list.length?list.map(s=>`<button class="card" data-subject="${s.id}"><div class="card-top"><span class="icon" style="background:${s.color}">${s.icon}</span><span class="tag">${['fra'].includes(s.id)?'OPTATIVA': ['fq','val','tec','mus','art'].includes(s.id)?'SEGONS EL CENTRE':'EXPLORA'}</span></div><h3>${s.name}</h3><p>${s.desc}</p><div class="card-bottom"><span>2 blocs · 6 preguntes · ${count(s.id)}/6 consolidables*</span><span class="arrow">↗</span></div><div class="bar"><i style="width:${count(s.id)/6*100}%"></i></div></button>`).join(''):'<p class="empty">No hi ha resultats. Prova una altra cerca.</p>';document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>subject(b.dataset.subject))}
function subject(id){const s=subjects.find(s=>s.id===id);main.innerHTML=warning()+`<button class="back" id="back">← Totes les matèries</button><div class="subject-banner" style="background:${s.color}"><div class="eyebrow">1r D’ESO · ITINERARI INICIAL</div><h1 class="page-title">${s.name}</h1><p>${s.desc}. Llegeix les idees clau i posa-les en pràctica. Cada resposta inclou una explicació.</p><button class="primary" id="practice-all">Practica els dos blocs</button></div><div class="topics">${s.topics.map((t,i)=>`<article class="topic"><span class="eyebrow">BLOC 0${i+1}</span><h3>${t.name}</h3><p>${t.lesson}</p><button class="primary" data-topic="${i}">Practica · 3 preguntes ↗</button></article>`).join('')}</div><p class="subtle">Aquestes activitats són una introducció. Llegir, escriure, parlar, experimentar, crear i fer activitat física requereix també pràctica fora del qüestionari.</p>`;document.querySelector('#back').onclick=()=>render();document.querySelector('#practice-all').onclick=()=>start(all.filter(q=>q.subject===id),s.name);document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(all.filter(q=>q.subject===id&&q.topic===s.topics[+b.dataset.topic].name),s.topics[+b.dataset.topic].name));window.scrollTo(0,0)}
function start(qs,title){if(!qs.length)return;session={qs:shuffle(qs),title,index:0,correct:0,answered:false,started:Date.now()};modal.showModal();question()}
function question(){const s=session,q=s.qs[s.index];s.answered=false;s.started=Date.now();document.querySelector('#activity-body').innerHTML=`<div class="eyebrow">${esc(s.title)}</div><p class="subtle">${esc(q.subjectName)} · ${esc(q.topic)}</p><div class="bar"><i style="width:${s.index/s.qs.length*100}%"></i></div><p class="subtle">Pregunta ${s.index+1} de ${s.qs.length}</p><h2 id="activity-title" class="question">${esc(q.text)}</h2><div class="options">${shuffle(q.options.map((text,i)=>({text,i}))).map(o=>`<button class="option" data-answer="${o.i}">${esc(o.text)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));document.querySelector('.option').focus()}
function answer(choice){const s=session;if(s.answered)return;s.answered=true;const q=s.qs[s.index],correct=choice===q.answer;if(correct)s.correct++;attempts.push({qid:q.id,subject:q.subject,topic:q.topic,question:q.text,answer:q.options[choice],expected:q.options[q.answer],correct,date:new Date().toISOString(),day:today(),seconds:Math.round((Date.now()-s.started)/1000)});save();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===q.answer)b.classList.add('correct');else if(+b.dataset.answer===choice)b.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<div class="feedback ${correct?'':'error'}"><strong>${correct?'Ben raonat!':'Seguim aprenent.'}</strong><br>${esc(q.explanation)}</div><button class="primary" id="next">${s.index+1<s.qs.length?'Següent pregunta →':'Veure el resultat'}</button>`;document.querySelector('#next').onclick=()=>{s.index++;if(s.index<s.qs.length)question();else result()};document.querySelector('#next').focus()}
function result(){const s=session;document.querySelector('#activity-body').innerHTML=`<div class="eyebrow">REPTE COMPLETAT</div><h2 id="activity-title" class="question">Cada pas compta.</h2><div class="result-score">${s.correct} / ${s.qs.length}</div><p class="subtle">Has revisat ${s.qs.length} idees. Pots consultar els encerts i les dificultats a «El meu progrés».</p>${warning()}<div class="actions"><button class="primary" id="finish">Continua explorant</button><button class="secondary" id="see-progress">Veure el progrés</button></div>`;document.querySelector('#finish').onclick=()=>{modal.close();render()};document.querySelector('#see-progress').onclick=()=>{modal.close();render('progress')}}
function progress(){const right=attempts.filter(a=>a.correct).length,miss=all.filter(q=>latest(q.id)&&!latest(q.id).correct);main.innerHTML=warning()+`<div class="eyebrow">EL TEU QUADERN DE VIATGE</div><h1 class="page-title">El meu progrés</h1><p class="subtle">El progrés es desa només en aquest navegador i dispositiu. Exporta’l per conservar-ne una còpia o compartir-lo per analitzar-lo. No hi ha sincronització entre dispositius.</p><div class="kpi"><div><strong>${attempts.length}</strong>respostes registrades</div><div><strong>${attempts.length?Math.round(right/attempts.length*100):0}%</strong>encerts sobre tots els intents</div><div><strong>${new Set(attempts.map(a=>a.day)).size}</strong>dies amb pràctica</div></div><h2 style="margin-top:32px">Els darrers 14 dies</h2><div class="calendar">${Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),n=attempts.filter(a=>a.day===key).length;return `<div class="day ${n?'done':''}" title="${key}: ${n} respostes">${d.getDate()}/${d.getMonth()+1}<br><strong>${n}</strong></div>`}).join('')}</div><div class="actions"><button class="primary" id="review" ${miss.length?'':'disabled'}>Repassa els errors pendents (${miss.length})</button><button class="secondary" id="export">Exporta el registre JSON</button><button class="secondary" id="csv">Exporta CSV</button></div><p class="subtle">* Les barres compten preguntes amb l’última resposta correcta. Són una orientació de pràctica, no una avaluació de domini de la matèria.</p><div class="table-wrap"><table><thead><tr><th>Matèria</th><th>Intents</th><th>Encerts</th><th>Últimes correctes</th></tr></thead><tbody>${subjects.map(s=>{const a=attempts.filter(a=>a.subject===s.id);return `<tr><td>${s.name}</td><td>${a.length}</td><td>${a.length?Math.round(a.filter(a=>a.correct).length/a.length*100)+'%':'—'}</td><td>${count(s.id)} / 6</td></tr>`}).join('')}</tbody></table></div><h2 style="margin-top:30px">Últimes respostes</h2>${attempts.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Pregunta</th><th>Resposta</th><th>Resultat</th></tr></thead><tbody>${attempts.slice(-30).reverse().map(a=>`<tr><td>${esc(new Date(a.date).toLocaleString('ca'))}</td><td>${esc(a.question)}</td><td>${esc(a.answer)}</td><td>${a.correct?'✓ Encert':'↻ Repassa'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">El teu viatge comença amb la primera pregunta.</p>'}`;document.querySelector('#review').onclick=()=>start(miss,'Reforcem les idees pendents');document.querySelector('#export').onclick=()=>download(JSON.stringify({app:'Brúixola',version:1,exported:new Date().toISOString(),attempts},null,2),'bruixola-registre.json','application/json');document.querySelector('#csv').onclick=()=>{const keys=['date','subject','topic','question','answer','expected','correct','seconds'];const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('\uFEFF'+[keys,...attempts.map(a=>keys.map(k=>a[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),'bruixola-registre.csv','text/csv;charset=utf-8')}}
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function about(){main.innerHTML=`<div class="eyebrow">UNA BASE OBERTA A CRÉIXER</div><h1 class="page-title">El mapa d’aprenentatge</h1><div class="prose"><p>Brúixola és un espai de repàs en català orientat a <strong>1r d’ESO</strong>. Aquesta primera versió conté <strong>78 preguntes originals, 26 blocs i 13 espais</strong>, amb explicacions per a cada resposta.</p><h2>Referència curricular</h2><p>La selecció parteix dels sabers i l’enfocament competencial publicats a <a href="https://xtec.gencat.cat/ca/curriculum/eso/curriculum-175-2022/" target="_blank" rel="noopener">XTEC · Currículum d’ESO, Decret 175/2022</a>. Consulta de la font: 16 de novembre de 2026.</p><p>El currículum agrupa nombrosos sabers per a 1r i 2n o per a 1r, 2n i 3r. Per això aquesta és una <strong>selecció introductòria proposada</strong>, no un temari oficial exhaustiu ni una distribució obligatòria per a 1r.</p><p>Música, educació plàstica, tecnologia, física i química i educació en valors poden tenir una distribució diferent segons el curs i el centre. El francès s’ofereix com a exemple de segona llengua optativa. Les optatives pròpies del centre, altres llengües, l’aranès a l’Aran i religió, si es cursa, s’adaptaran quan disposem del programa concret.</p><h2>Més enllà de respondre preguntes</h2><p>Els qüestionaris permeten una primera pràctica de comprensió i raonament. No substitueixen l’expressió oral i escrita, les lectures, els experiments, la creació artística, la interpretació musical ni l’activitat física.</p><h2>Quan tinguem els teus temaris</h2><p>Podrem ajustar els blocs, afegir exercicis oberts i problemes, graduar la dificultat i preparar el repàs d’exàmens segons el que treballeu a classe.</p><h2>Què es guarda?</h2><p>Cada resposta registra la pregunta, la resposta triada, la solució, el resultat, el bloc, la data i el temps de resposta. Es desa al navegador d’aquest dispositiu. Si n’esborres les dades, es perdrà el registre; a «El meu progrés» el pots exportar en JSON o CSV. No s’envien respostes a un servidor.</p></div>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));document.querySelector('.brand').onclick=e=>{e.preventDefault();render()};document.querySelector('#close').onclick=()=>modal.close();modal.addEventListener('close',()=>{session=null});render();
</script></body></html>
